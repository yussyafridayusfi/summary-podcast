# Render Blueprint — infrastructure as code for the backend.
# One-click: https://render.com/deploy?repo=https://github.com/yussyafridayusfi/summary-podcast
# Docs: https://render.com/docs/blueprint-spec
#
# Creates ONE free web service (the Express/tsx API). The database is Neon
# (Render's own free Postgres is deleted after 30 days); paste the Neon
# connection string into DATABASE_URL when Render prompts for it.

services:
  - type: web
    name: summary-hub-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- required -----------------------------------------------------------
      - key: DATABASE_URL
        sync: false # Neon connection string, keep ?sslmode=require
      - key: NODE_ENV
        value: production # hides the dev sign-in-code hint on a public host
      # --- AI (optional; add ONE free key for real summaries) ------------------
      - key: AI_TEXT_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # --- Email for sign-in codes (optional; Brevo/Resend SMTP) --------------
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # --- Misc ---------------------------------------------------------------
      - key: APP_NAME
        value: Summary Hub
      - key: APP_URL
        sync: false # your Vercel URL, used for OpenRouter attribution headers
